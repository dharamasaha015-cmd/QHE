<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Layered Fermi Sphere</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

#panel{
position:absolute;
top:20px;
right:20px;
background:rgba(0,0,0,0.6);
padding:15px;
color:white;
border:1px solid #00eaff;
}

#title{
position:absolute;
top:20px;
left:20px;
color:#00eaff;
font-size:26px;
text-shadow:0 0 10px #00eaff;
}

</style>
</head>

<body>

<div id="title">Fermi Sphere Layers</div>

<div id="panel">

Show Layer:
<select id="layerSelect">
<option value="all">All Layers</option>
<option value="0">Layer 1</option>
<option value="1">Layer 2</option>
<option value="2">Layer 3</option>
<option value="3">Layer 4</option>
<option value="4">Layer 5</option>
<option value="5">Layer 6</option>
</select>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
)

camera.position.z = 7

const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

const controls = new THREE.OrbitControls(camera,renderer.domElement)

const ambient = new THREE.AmbientLight(0xffffff,0.4)
scene.add(ambient)

const light = new THREE.PointLight(0xffffff,1.5)
light.position.set(5,5,5)
scene.add(light)

const layers = 6
const kF = 2.5

const colors = [
0xff4c4c,
0xffa64c,
0xffff4c,
0x4cff4c,
0x4cc3ff,
0xb84cff
]

const layerObjects = []


// ELECTRON SETTINGS

const electronMaterial = new THREE.MeshBasicMaterial({color:0xffffff})
const electronGeometry = new THREE.SphereGeometry(0.03,8,8)



for(let i=0;i<layers;i++){

let radius = (kF/layers)*(i+1)

const group = new THREE.Group()

// shell

const shellGeo = new THREE.SphereGeometry(radius,64,64)

const shellMat = new THREE.MeshBasicMaterial({

color:colors[i],
wireframe:true,
transparent:true,
opacity:0.5

})

const shell = new THREE.Mesh(shellGeo,shellMat)

group.add(shell)


// electrons

for(let j=0;j<120;j++){

let theta = Math.acos(2*Math.random()-1)
let phi = 2*Math.PI*Math.random()

let x = radius*Math.sin(theta)*Math.cos(phi)
let y = radius*Math.sin(theta)*Math.sin(phi)
let z = radius*Math.cos(theta)

const electron = new THREE.Mesh(electronGeometry,electronMaterial)

electron.position.set(x,y,z)

group.add(electron)

}

scene.add(group)

layerObjects.push(group)

}


// AXES

const axes = new THREE.AxesHelper(4)
scene.add(axes)


// LABELS

function label(text){

const canvas=document.createElement("canvas")
const ctx=canvas.getContext("2d")

ctx.font="48px Arial"
ctx.fillStyle="#00eaff"
ctx.fillText(text,0,50)

const texture=new THREE.CanvasTexture(canvas)

const material=new THREE.SpriteMaterial({map:texture})

const sprite=new THREE.Sprite(material)

sprite.scale.set(1.5,0.7,1)

return sprite

}

const kx=label("kx")
kx.position.set(4,0,0)
scene.add(kx)

const ky=label("ky")
ky.position.set(0,4,0)
scene.add(ky)

const kz=label("kz")
kz.position.set(0,0,4)
scene.add(kz)


// LAYER CONTROL

document.getElementById("layerSelect").addEventListener("change",function(){

let value=this.value

if(value==="all"){

layerObjects.forEach(l=>l.visible=true)

}

else{

layerObjects.forEach((l,i)=>{

l.visible=(i==value)

})

}

})


// ANIMATION

function animate(){

requestAnimationFrame(animate)

scene.rotation.y+=0.002

controls.update()

renderer.render(scene,camera)

}

animate()

</script>

</body>
</html>
