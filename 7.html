<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Contrast Landau Simulation</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #050505; /* Pure black for maximum contrast */
            font-family: 'Segoe UI', sans-serif; 
        }
        #ui-panel { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: rgba(20, 20, 20, 0.9); 
            padding: 20px; 
            border-radius: 4px; 
            width: 300px;
            border: 1px solid #444;
            color: #eee;
        }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        .b-text { color: #00aaff; font-weight: bold; } /* Matching tube color */
        .k-text { color: #ffaa00; font-weight: bold; } /* Matching sphere color */
        input[type="range"] { width: 100%; margin-bottom: 15px; cursor: pointer; }
        .instructions { font-size: 12px; color: #999; border-top: 1px solid #333; pt: 10px; margin-top: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: bold; font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #444;">CONTRAST VIEW</div>
        
        <div class="label-row">
            <span>Magnetic Field (B)</span>
            <span class="b-text" id="bVal">1.0 T</span>
        </div>
        <input type="range" id="bField" min="0.2" max="5.0" step="0.1" value="1.0">

        <div class="label-row">
            <span>Fermi Radius (k_F)</span>
            <span class="k-text" id="kVal">10.0</span>
        </div>
        <input type="range" id="kFermi" min="5.0" max="15.0" step="0.5" value="10.0">

        <div class="instructions">
            The <span class="k-text">ORANGE</span> sphere represents the Fermi surface boundary.<br><br>
            The <span class="b-text">BLUE</span> cylinders are the quantized Landau tubes.
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 15, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        const objectsGroup = new THREE.Group();
        scene.add(objectsGroup);

        // HIGH CONTRAST MATERIALS
        // 1. The Sphere: Warm Amber/Orange
        const sphereMat = new THREE.MeshPhongMaterial({
            color: 0xffaa00,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide, // Render inside for better tube visibility
            shininess: 100
        });
        
        const sphereOuterMat = new THREE.MeshPhongMaterial({
            color: 0xffaa00,
            transparent: true,
            opacity: 0.05,
            side: THREE.FrontSide
        });

        const sphereGeom = new THREE.SphereGeometry(1, 64, 64);
        const fermiSphereInside = new THREE.Mesh(sphereGeom, sphereMat);
        const fermiSphereOutside = new THREE.Mesh(sphereGeom, sphereOuterMat);
        scene.add(fermiSphereInside);
        scene.add(fermiSphereOutside);

        // 2. The Tubes: Sharp Electric Blue
        const tubeMat = new THREE.MeshStandardMaterial({
            color: 0x0088ff,
            metalness: 0.8,
            roughness: 0.2,
            side: THREE.DoubleSide,
            polygonOffset: true,
            polygonOffsetFactor: 1, 
            polygonOffsetUnits: 1
        });

        const tubeEdgeMat = new THREE.LineBasicMaterial({ color: 0x00ffff, opacity: 0.5, transparent: true });

        function draw() {
            while(objectsGroup.children.length > 0){ 
                objectsGroup.children[0].geometry?.dispose();
                objectsGroup.remove(objectsGroup.children[0]); 
            }

            const B = parseFloat(document.getElementById('bField').value);
            const kF = parseFloat(document.getElementById('kFermi').value);

            fermiSphereInside.scale.set(kF, kF, kF);
            fermiSphereOutside.scale.set(kF, kF, kF);

            let n = 0;
            while (true) {
                const r = 2.5 * Math.sqrt((n + 0.5) * B);
                if (r >= kF) break;
                const h = 2 * Math.sqrt(kF * kF - r * r);

                const cylGeom = new THREE.CylinderGeometry(r, r, h, 64, 1, true);
                const cyl = new THREE.Mesh(cylGeom, tubeMat);
                
                const edges = new THREE.EdgesGeometry(cylGeom);
                const line = new THREE.LineSegments(edges, tubeEdgeMat);
                cyl.add(line);
                
                objectsGroup.add(cyl);
                n++;
            }
        }

        document.getElementById('bField').addEventListener('input', (e) => {
            document.getElementById('bVal').innerText = e.target.value + " T";
            draw();
        });
        document.getElementById('kFermi').addEventListener('input', (e) => {
            document.getElementById('kVal').innerText = parseFloat(e.target.value).toFixed(1);
            draw();
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        draw();
        function animate() {
            requestAnimationFrame(animate);
            objectsGroup.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
